name: Publish to NPM

on:
  release:
    types: [created]

env:
  HUSKY: 0
  NODE_VERSION: 24
  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # for `npm publish`
  BUN_VERSION: latest
  NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }} # for `bun publish`
  NPM_REGISTRY_URL: https://registry.npmjs.org/

jobs:
  prepare-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org/

      - run: bun install --frozen-lockfile
      - run: bun run lint

      - name: Set Package Version
        run: |
          TAG_NAME="${{ github.event.release.tag_name }}"
          echo "Validating tag: $TAG_NAME"

          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(rc|alpha|beta)\.[0-9]+)?$ ]]; then
            echo "❌ Invalid tag format. Expected: v<MAJOR>.<MINOR>.<PATCH>[-<rc|alpha|beta>.<N>] (e.g., v1.2.3, v1.2.3-rc.1)"
            exit 1
          fi

          VERSION=${TAG_NAME#v}
          echo "Setting package version to $VERSION"

          npm version --no-git-tag-version "$VERSION"

      - run: npm publish --provenance --access public
